services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/team-task-board
      JWT_SECRET: local-development-secret-change-me
      NODE_ENV: production
    ports:
      - "5000:5000"
    depends_on:
      - mongodb

volumes:
  mongo_data:
